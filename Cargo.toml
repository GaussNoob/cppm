[package]
name = "cppm"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
description = "A small, convention-driven C++ project manager"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
ctrlc = { version = "3.5", features = ["termination"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
same-file = "1.0"
tempfile = "3.15"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

