name: Debug Windows release step
on:
  push:
    branches: [debug-windows-release]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: rustup update stable --no-self-update
      - run: python -m pip install conan==2.34.0 cmake==3.31.6 ninja==1.11.1.4
      - run: cargo build --release --locked
      - name: Doctor from the repository
        run: target/release/cppm doctor
        continue-on-error: true
      - name: Test Windows install (Windows PowerShell, as in release.yml)
        shell: powershell
        run: ./scripts/test-install.ps1
      - name: Bootstrap test (as in release.yml)
        shell: powershell
        run: ./scripts/test-bootstrap.ps1
      - run: python scripts/package.py
      - run: choco install nsis -y --no-progress
      - run: python scripts/package-windows-installer.py --makensis 'C:\Program Files (x86)\NSIS\makensis.exe'
      - run: Get-ChildItem dist
