name: Debug Windows release step
on:
  push:
    branches: [debug-windows-release]
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: rustup update stable --no-self-update
      - run: python -m pip install conan==2.34.0 cmake==3.31.6 ninja==1.11.1.4
      - run: cargo build --release --locked
      - name: Doctor from the repository
        run: target/release/cppm doctor
        continue-on-error: true
      - name: Test Windows install (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: ./scripts/test-install.ps1
