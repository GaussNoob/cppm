root /srv/cppm/current;
index index.html;
client_max_body_size 64k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
keepalive_timeout 15s;
keepalive_requests 500;
limit_conn gauss_site_connections 40;
limit_conn_status 429;
limit_req_status 429;
limit_req_log_level warn;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Retry-After $gauss_site_retry_after always;
location = /RELEASE {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    default_type text/plain;
    expires -1;
}
location ~ /\. { deny all; }
location ^~ /_next/static/ {
    if ($gauss_site_origin_allowed = 0) { return 444; }
    limit_req zone=gauss_site_assets burst=120 nodelay;
    limit_req zone=gauss_site_total burst=400 nodelay;
    expires 1y;
    try_files $uri =404;
    access_log off;
}
location ^~ /downloads/ {
    if ($gauss_site_origin_allowed = 0) { return 444; }
    limit_req zone=gauss_site_downloads burst=5 nodelay;
    limit_req zone=gauss_site_total burst=400 nodelay;
    limit_conn gauss_site_connections 4;
    limit_rate 2m;
    try_files $uri =404;
}
location / {
    if ($gauss_site_origin_allowed = 0) { return 444; }
    limit_req zone=gauss_site_pages burst=30 nodelay;
    limit_req zone=gauss_site_total burst=400 nodelay;
    limit_except GET HEAD { deny all; }
    expires -1;
    try_files $uri $uri.html $uri/ =404;
}
error_page 404 /404.html;
