server {
    listen 80;
    listen [::]:80;
    server_name cppm.gaussnoob.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location = /RELEASE {
        allow 127.0.0.1; allow ::1; deny all;
        root /srv/cppm/current;
        default_type text/plain;
        expires -1;
    }
    location / {
        if ($gauss_site_origin_allowed = 0) { return 444; }
        return 301 https://cppm.gaussnoob.com.br$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cppm.gaussnoob.com.br;
    ssl_certificate /etc/letsencrypt/live/cppm.gaussnoob.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cppm.gaussnoob.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    include /etc/nginx/snippets/cppm-static.conf;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
